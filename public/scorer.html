<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorer Controller - Pickleball Tournament</title>
  <style>
    :root {
      --primary-red: #e1251b;
      --dark-bg: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--dark-bg);
      color: #0f172a;
    }

    .header-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    
    .brand-logo { height: 50px; object-fit: contain; }
    h1 { font-size: 28px; font-weight: 800; margin: 0; text-align: center; color: #1e293b; letter-spacing: -0.5px; }

    .header-status-box {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .court-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-red);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .timer-display {
      font-size: 24px;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      padding: 6px 18px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid #bae6fd;
    }

    .control-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn-action {
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }
    .btn-coin { background: #0284c7; }
    .btn-swap { background: #475569; }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .team-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .team-name {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .score-value {
      font-size: 64px;
      font-weight: 900;
      color: var(--primary-red);
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }

    .btn-score-add {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: 800;
      background: var(--primary-red);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-score-sub {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      background: #e2e8f0;
      color: #475569;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      background: var(--primary-red);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* COIN TOSS MODAL & INTERACTIVE COIN */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 340px;
    }
    .coin-wrapper {
      perspective: 1000px;
      width: 120px;
      height: 120px;
      margin: 20px auto;
      cursor: pointer;
    }
    .coin-wrapper.locked {
      cursor: not-allowed;
    }
    .coin {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .coin-face {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: white;
      border: 4px solid #f59e0b;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .coin-heads { background: linear-gradient(135deg, #fbbf24, #d97706); }
    .coin-tails { background: linear-gradient(135deg, #94a3b8, #475569); border-color: #cbd5e1; transform: rotateY(180deg); }
    
    .instruction-text {
      font-size: 15px;
      font-weight: 800;
      color: #0284c7; /* MATCHING BLUE COLOR */
      margin-top: 8px;
      margin-bottom: 4px;
      min-height: 20px;
    }

    .btn-close-modal {
      display: none;
      margin-top: 14px;
      width: 100%;
      padding: 10px;
      background: #0f172a;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .brand-logo { height: 38px; }
      h1 { font-size: 22px; }
      .court-title { font-size: 22px; }
      .timer-display { font-size: 20px; }
      .score-value { font-size: 48px; }
    }
  </style>
</head>
<body>

  <div class="header-card">
    <div class="brand-header">
      <img src="/logo.png" alt="Logo" class="brand-logo">
      <h1>Scorer Controller</h1>
    </div>
  </div>

  <div class="header-status-box">
    <div class="court-title" id="courtTitle">Court 4 - Live Match</div>
    <div class="timer-display" id="timerDisplay">⏱ 00:00</div>
  </div>

  <div class="control-actions">
    <button class="btn-action btn-coin" onclick="openCoinModal()">🪙 Coin Toss</button>
    <button class="btn-action btn-swap" onclick="handleSwapSides()">↔ Swap Sides</button>
  </div>

  <div class="scoreboard-grid">
    <div class="team-card">
      <div class="team-name" id="teamAName">Team A</div>
      <div class="score-value" id="scoreA">0</div>
      <button class="btn-score-add" onclick="updateScore('A', 1)">+1</button>
      <button class="btn-score-sub" onclick="updateScore('A', -1)">-1</button>
    </div>

    <div class="team-card">
      <div class="team-name" id="teamBName">Team B</div>
      <div class="score-value" id="scoreB">0</div>
      <button class="btn-score-add" onclick="updateScore('B', 1)">+1</button>
      <button class="btn-score-sub" onclick="updateScore('B', -1)">-1</button>
    </div>
  </div>

  <button class="btn-submit" onclick="finishMatch()">🏁 Finish Match & Submit Score</button>

  <!-- COIN TOSS MODAL -->
  <div class="modal-overlay" id="coinModal">
    <div class="modal-card">
      <h3 style="margin: 0; color: #1e293b; font-size: 20px;" id="modalTitle">Coin Toss</h3>
      <div class="coin-wrapper" id="coinWrapper" onclick="flipCoin()">
        <div class="coin" id="coinElement">
          <div class="coin-face coin-heads">HEADS</div>
          <div class="coin-face coin-tails">TAILS</div>
        </div>
      </div>
      <div id="resultText" style="font-size: 16px; font-weight: 800; color: #0284c7; min-height: 24px;">Click the coin to flip!</div>
      <div class="instruction-text" id="instructionText"></div>
      <button class="btn-close-modal" id="closeModalBtn" onclick="closeCoinModal()">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const courtId = urlParams.get('court') || '4';

    let matchData = {
      scoreA: 0,
      scoreB: 0,
      teamA: '',
      teamB: '',
      startedAt: null,
      elapsedTime: 0,
      isPaused: false
    };

    function formatName(name) {
      if (!name) return '';
      if (name.includes('/')) {
        return name.split('/').map(s => s.trim()).filter(Boolean).join('\n');
      }
      if (name.includes('&')) {
        return name.split('&').map(s => s.trim()).filter(Boolean).join('\n');
      }
      const parts = name.trim().split(/\s+/);
      if (parts.length > 1) {
        return `${parts[0]}\n${parts.slice(1).join(' ')}`;
      }
      return name;
    }

    socket.on('initData', data => updateCourtState(data));
    socket.on('stateUpdated', data => updateCourtState(data));

    function updateCourtState(data) {
      if (!data || !data.activeCourts || !data.activeCourts[courtId]) return;
      const court = data.activeCourts[courtId];
      
      matchData = { ...court };
      
      document.getElementById('courtTitle').innerText = `Court ${courtId} - Live Match`;
      document.getElementById('teamAName').innerText = formatName(court.teamA);
      document.getElementById('teamBName').innerText = formatName(court.teamB);
      document.getElementById('scoreA').innerText = court.scoreA;
      document.getElementById('scoreB').innerText = court.scoreB;
    }

    function updateScore(team, delta) {
      if (team === 'A') {
        matchData.scoreA = Math.max(0, matchData.scoreA + delta);
        document.getElementById('scoreA').innerText = matchData.scoreA;
      } else {
        matchData.scoreB = Math.max(0, matchData.scoreB + delta);
        document.getElementById('scoreB').innerText = matchData.scoreB;
      }

      socket.emit('updateScore', {
        courtId,
        scoreA: matchData.scoreA,
        scoreB: matchData.scoreB
      });
    }

    function handleSwapSides() {
      const tempName = matchData.teamA;
      matchData.teamA = matchData.teamB;
      matchData.teamB = tempName;

      const tempScore = matchData.scoreA;
      matchData.scoreA = matchData.scoreB;
      matchData.scoreB = tempScore;

      document.getElementById('teamAName').innerText = formatName(matchData.teamA);
      document.getElementById('teamBName').innerText = formatName(matchData.teamB);
      document.getElementById('scoreA').innerText = matchData.scoreA;
      document.getElementById('scoreB').innerText = matchData.scoreB;

      socket.emit('swapTeams', { courtId });
    }

    /* FLIP & LOCK LOGIC */
    let isFlipping = false;
    let isHasFlipped = false;

    function openCoinModal() {
      document.getElementById('coinModal').style.display = 'flex';
      document.getElementById('modalTitle').innerText = 'Coin Toss';
      document.getElementById('resultText').innerText = 'Click the coin to flip!';
      document.getElementById('instructionText').innerText = '';
      document.getElementById('closeModalBtn').style.display = 'block';
      
      // Reset state for new modal session
      isFlipping = false;
      isHasFlipped = false;
      document.getElementById('coinWrapper').classList.remove('locked');
      document.getElementById('coinElement').style.transform = 'rotateY(0deg)';
    }

    function flipCoin() {
      // Prevent clicking while spinning OR if already flipped once
      if (isFlipping || isHasFlipped) return;
      isFlipping = true;

      const coin = document.getElementById('coinElement');
      const modalTitle = document.getElementById('modalTitle');
      const resultText = document.getElementById('resultText');
      const instructionText = document.getElementById('instructionText');
      const closeBtn = document.getElementById('closeModalBtn');

      modalTitle.innerText = 'Flipping...';
      resultText.innerText = '';
      instructionText.innerText = '';
      closeBtn.style.display = 'none';

      const isHeads = Math.random() < 0.5;

      // HEADS = 3600 deg, TAILS = 3780 deg
      const targetDegree = isHeads ? 3600 : 3780;
      
      coin.style.transform = `rotateY(${targetDegree}deg)`;

      setTimeout(() => {
        const winningSide = isHeads ? 'HEADS' : 'TAILS';
        modalTitle.innerText = `Result: ${winningSide}`;
        resultText.innerText = winningSide;
        instructionText.innerText = 'Please choose side or serve';
        closeBtn.style.display = 'block';
        
        isFlipping = false;
        isHasFlipped = true; // Lock further coin clicks
        document.getElementById('coinWrapper').classList.add('locked');
      }, 3000);
    }

    function closeCoinModal() {
      if (isFlipping) return;
      document.getElementById('coinModal').style.display = 'none';
    }

    function finishMatch() {
      if (confirm('Are you sure you want to finish this match and submit final scores?')) {
        socket.emit('finishMatch', { courtId, scoreA: matchData.scoreA, scoreB: matchData.scoreB });
      }
    }

    setInterval(() => {
      if (matchData && matchData.startedAt) {
        let elapsed = matchData.elapsedTime || 0;
        if (!matchData.isPaused) {
          elapsed += Math.floor((Date.now() - matchData.startedAt) / 1000);
        }
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `⏱ ${mins}:${secs}`;
      }
    }, 1000);
  </script>
</body>
</html>
