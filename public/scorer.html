<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Scorer</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; text-align: center; background: #0f172a; color: white; }
    h2 { color: #38bdf8; margin-top: 5px; }
    .court-badge { background: #334155; display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
    .score-container { display: flex; justify-content: space-around; gap: 10px; margin: 20px 0; }
    .team-card { background: #1e293b; padding: 15px; border-radius: 12px; flex: 1; border: 1px solid #334155; }
    .team-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #f8fafc; word-break: break-word; }
    .score { font-size: 64px; font-weight: bold; color: #38bdf8; margin: 10px 0; }
    .btn { font-size: 28px; width: 100%; padding: 12px 0; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-plus { background: #22c55e; color: white; }
    .btn-minus { background: #ef4444; color: white; }
    .btn-finish { background: #eab308; color: black; font-size: 18px; padding: 15px; margin-top: 15px; }
.team-name {
    font-size: 24px;
    font-weight: bold;
    white-space: pre-line; /* Allows line break rendering */
  }
  </style>
</head>
<body>
  <div class="court-badge" id="courtLabel">Court --</div>
  
  <div id="activeMatchArea" style="display:none;">
    <div class="score-container">
      <div class="team-card">
        <div class="team-name" id="teamAName">Team A</div>
        <div class="score" id="scoreA">0</div>
        <button class="btn btn-plus" onclick="adjustScore('A', 1)">+1</button>
        <button class="btn btn-minus" onclick="adjustScore('A', -1)">-1</button>
      </div>
      <div class="team-card">
        <div class="team-name" id="teamBName">Team B</div>
        <div class="score" id="scoreB">0</div>
        <button class="btn btn-plus" onclick="adjustScore('B', 1)">+1</button>
        <button class="btn btn-minus" onclick="adjustScore('B', -1)">-1</button>
      </div>
    </div>
    <button class="btn btn-finish" onclick="submitFinalScore()">Submit Final Score</button>
  </div>

  <div id="waitingArea" style="margin-top: 50px; color: #94a3b8;">
    <h3>Waiting for host to assign a match to this court...</h3>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const courtId = urlParams.get('court') || 1;

    document.getElementById('courtLabel').innerText = `Court ${courtId}`;

    let scoreA = 0, scoreB = 0;

    socket.on('initData', processCourtState);
    socket.on('stateUpdated', processCourtState);

    function processCourtState(data) {
      const active = data.activeCourts[courtId];
      if (active && active.matchId) {
        scoreA = active.scoreA;
        scoreB = active.scoreB;
        document.getElementById('teamAName').innerText = active.teamA;
        document.getElementById('teamBName').innerText = active.teamB;
        document.getElementById('scoreA').innerText = scoreA;
        document.getElementById('scoreB').innerText = scoreB;
        
        document.getElementById('activeMatchArea').style.display = 'block';
        document.getElementById('waitingArea').style.display = 'none';
      } else {
        document.getElementById('activeMatchArea').style.display = 'none';
        document.getElementById('waitingArea').style.display = 'block';
      }
    }

    function adjustScore(team, delta) {
      if (team === 'A') scoreA = Math.max(0, scoreA + delta);
      if (team === 'B') scoreB = Math.max(0, scoreB + delta);
      document.getElementById('scoreA').innerText = scoreA;
      document.getElementById('scoreB').innerText = scoreB;

      socket.emit('updateScore', { courtId, scoreA, scoreB });
    }

    function submitFinalScore() {
      if (confirm(`Submit final score: ${scoreA} - ${scoreB}?`)) {
        socket.emit('finishMatch', { courtId });
      }
    }
  </script>
</body>
</html>
