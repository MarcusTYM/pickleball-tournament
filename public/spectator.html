<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectator View - Pickleball Tournament</title>
  <style>
    :root {
      --dark-bg: #0b1329;
      --card-bg: #152238;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #d97706;
      --primary-red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--dark-bg);
      color: #ffffff;
    }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 12px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 900;
      color: #0f172a;
      margin: 0;
      text-transform: uppercase;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-red);
      text-transform: uppercase;
      border-left: 4px solid var(--primary-red);
      padding-left: 10px;
      margin-bottom: 16px;
    }

    #liveCourtsSection {
      margin-bottom: 30px;
      transition: all 0.3s ease;
    }

    .courts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .court-card {
      background: var(--card-bg);
      border: 1px solid var(--primary-red);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .podium-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
    }

    .podium-card.champion { border: 2px solid var(--gold); }
    .podium-card.runner-up { border: 2px solid var(--silver); }
    .podium-card.third-place { border: 2px solid var(--bronze); }

    .podium-winner-name {
      font-size: 18px;
      font-weight: 900;
      white-space: pre-line;
      line-height: 1.3;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="/logo.png" alt="Logo" style="height: 48px;">
      <h1 class="header-title">Live Tournament Scoreboard</h1>
    </div>
  </div>

  <!-- LIVE COURTS SECTION -->
  <div id="liveCourtsSection">
    <div class="section-title">Live Courts</div>
    <div class="courts-grid" id="courtsContainer"></div>
  </div>

  <!-- KNOCKOUT STAGE / PODIUM -->
  <div class="podium-section">
    <div class="section-title">Knockout Stage</div>
    <div class="podium-grid">
      <div class="podium-card champion">
        <div style="font-size:32px;">🏆</div>
        <div style="color:var(--gold); font-weight:900; font-size:12px;">CHAMPION (1ST PLACE)</div>
        <div class="podium-winner-name" id="championName">-</div>
      </div>
      <div class="podium-card runner-up">
        <div style="font-size:32px;">🥈</div>
        <div style="color:var(--silver); font-weight:900; font-size:12px;">1ST RUNNER-UP (2ND PLACE)</div>
        <div class="podium-winner-name" id="runnerUpName">-</div>
      </div>
      <div class="podium-card third-place">
        <div style="font-size:32px;">🥉</div>
        <div style="color:var(--bronze); font-weight:900; font-size:12px;">2ND RUNNER-UP (3RD PLACE)</div>
        <div class="podium-winner-name" id="thirdPlaceName">-</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function formatName(name) {
      if (!name) return '';
      if (name.includes('/')) return name.split('/').map(s => s.trim()).join('\n');
      if (name.includes('&')) return name.split('&').map(s => s.trim()).join('\n');
      return name;
    }

    socket.on('initData', updateSpectatorView);
    socket.on('stateUpdated', updateSpectatorView);

    function updateSpectatorView(data) {
      if (!data) return;

      const podium = data.podium || {};
      const activeCourts = data.activeCourts || {};
      const liveCourtsSection = document.getElementById('liveCourtsSection');

      // Check if all 3 podium spots are occupied
      const isPodiumComplete = Boolean(
        podium.champion && 
        podium.runnerUp && 
        podium.thirdPlace
      );

      // Hide live courts section when podium appears
      if (isPodiumComplete) {
        liveCourtsSection.style.display = 'none';
      } else {
        liveCourtsSection.style.display = 'block';
      }

      // Update Podium text
      document.getElementById('championName').innerText = formatName(podium.champion) || '-';
      document.getElementById('runnerUpName').innerText = formatName(podium.runnerUp) || '-';
      document.getElementById('thirdPlaceName').innerText = formatName(podium.thirdPlace) || '-';

      // Render courts logic...
    }
  </script>
</body>
</html>
